name: Sync shiny-aiconversation Skill

on:
  push:
    branches:
      - main
      - 'v*'
    paths:
      - 'skills/shiny-aiconversation/**'
  workflow_dispatch:

jobs:
  sync-skill:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v7
        with:
          path: source

      - name: Checkout skills repository
        uses: actions/checkout@v7
        with:
          repository: shinyorg/skills
          token: ${{ secrets.SKILLS_REPO_TOKEN }}
          path: skills-repo

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync shiny-aiconversation skill
        run: |
          mkdir -p skills-repo/plugins/shiny-client/skills
          rm -rf skills-repo/plugins/shiny-client/skills/shiny-aiconversation
          cp -r source/skills/shiny-aiconversation skills-repo/plugins/shiny-client/skills/

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.SKILLS_REPO_TOKEN }}
          path: skills-repo
          commit-message: "Update shiny-aiconversation skill from Shiny Speech repository"
          title: "Update shiny-aiconversation skill"
          body: |
            This PR updates the shiny-aiconversation skill from the [Shiny Speech repository](https://github.com/shinyorg/speech).

            **Source commit:** ${{ github.sha }}
            **Triggered by:** @${{ github.actor }}

            ---
            *This PR was automatically created by the [sync-aiconversation-skill workflow](https://github.com/shinyorg/speech/actions/workflows/sync-aiconversation-skill.yml).*
          branch: update-shiny-aiconversation-skill
          delete-branch: true
          labels: |
            automated
            skills-update
