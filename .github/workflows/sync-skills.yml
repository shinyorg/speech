name: Sync Skills to Skills Repository

on:
  push:
    branches:
      - main
    paths:
      - 'skills/**'
  workflow_dispatch:

jobs:
  sync-skills:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout skills repository
        uses: actions/checkout@v4
        with:
          repository: shinyorg/skills
          token: ${{ secrets.SKILLS_REPO_TOKEN }}
          path: skills-repo

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync skills directory
        run: |
          # Copy each skill to the shiny-client plugin in the skills repo
          mkdir -p skills-repo/plugins/shiny-client/skills
          for skill in source/skills/*/; do
            name=$(basename "$skill")
            # Remove existing skill directory to ensure clean sync
            rm -rf "skills-repo/plugins/shiny-client/skills/$name"
            cp -r "$skill" "skills-repo/plugins/shiny-client/skills/$name"
          done

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.SKILLS_REPO_TOKEN }}
          path: skills-repo
          commit-message: "Update shiny-speech & shiny-aiconversation skills from Shiny Speech repository"
          title: "Update shiny-speech & shiny-aiconversation skills"
          body: |
            This PR updates the shiny-speech and shiny-aiconversation skills from the [Shiny Speech repository](https://github.com/shinyorg/speech).

            **Source commit:** ${{ github.sha }}
            **Triggered by:** @${{ github.actor }}
            ---
            *This PR was automatically created by the [sync-skills workflow](https://github.com/shinyorg/speech/actions/workflows/sync-skills.yml).*
          branch: update-shiny-speech-skill
          delete-branch: true
          labels: |
            automated
            skills-update
