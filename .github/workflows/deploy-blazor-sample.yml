name: Deploy Blazor Sample

on:
  workflow_dispatch:
  push:
    branches:
      - 'v*'
    paths:
      - 'samples/BlazorSample/**'
      - 'src/speech/**'
      - 'src/aiconversation/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/deploy-blazor-sample.yml'

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  BASE_HREF: /speech/
  SAMPLE_CSPROJ: samples/BlazorSample/BlazorSample.csproj

jobs:
  build:
    # macOS so Shiny.Speech's net10.0-ios TFM can resolve its workload pack
    # during project-graph restore. Linux runners fail with NETSDK1178 on
    # Microsoft.iOS.Sdk.net10.0_26.x packs.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # Nerdbank.GitVersioning needs full history

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore workloads
        run: dotnet workload restore "${{ env.SAMPLE_CSPROJ }}"

      - name: Publish
        run: dotnet publish "${{ env.SAMPLE_CSPROJ }}" -c Release -o publish

      - name: Rewrite base href + add SPA fallback
        run: |
          # perl instead of sed: the runner is macOS, and BSD sed's -i consumes the
          # next argument as the backup extension, so "sed -i -E" silently ran in
          # BRE mode (no rewrite) and left an index.html-E turd behind.
          perl -pi -e 's|<base href="/"\s*/>|<base href="$ENV{BASE_HREF}" />|g' publish/wwwroot/index.html
          # fail loudly rather than shipping a site whose every asset 404s
          grep -qF '<base href="'"$BASE_HREF"'" />' publish/wwwroot/index.html \
            || { echo "::error::base href rewrite failed"; cat publish/wwwroot/index.html; exit 1; }
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          touch publish/wwwroot/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: publish/wwwroot
          # v4 stopped bundling dotfiles by default, which silently drops .nojekyll
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
